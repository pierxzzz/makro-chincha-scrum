  </defs>
  <rect width="1200" height="240" rx="22" fill="url(#bg)"/>
  <path d="M260 120h130M550 120h130M840 120h130" fill="none" stroke="#07529b" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
